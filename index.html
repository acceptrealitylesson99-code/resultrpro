<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score cA;lculator</title>
</head>
<style>
    
    #math, #urdu, #eng, #sindhi, #comp{
        display: block;
        border: 2px solid #2564ebab;
        
    }

     #math:hover, #urdu:hover, #eng:hover, #sindhi:hover, #comp:hover{
        box-shadow: 0 0 5px #2564ebab;
        border: 2px solid #2564ebab;
    }
#btn{
    display: block;
    padding: 10px 20px 10px 20px;
    border-radius: 30px;
border-color: #2564eb;

}
#marks{
    background-color: #F8FAFC;
    font-weight: 700;
    border: 1px solid  #2564eb;
}
#output{
    background-color: #2564ebde;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    
    justify-content: center;
}
.box{
width: 800px;
    font-size: 20px;
    font-weight: 700;
}
#status{
    font-size: 30px;
    font-weight: bold;
}
.hero{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;


}
.navbar{
    background-color: #2564eb;
}
</style>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">ScoreCalculator</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="home.html">Home</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
<div class=" hero container p-5 rounded-5 ">
    <div class=" box row">
        <div class="col-md-4  p-3 text-center text-white" id="output">
            <h1 class="text-center text-white"> Result</h1>
            <div class="box1">
Percentage: <span id="per"></span><br>
            
            Grade: <span id="grade"></span><br>
            Total Marks: <span id="tot"></span><br>
            <span id="status"></span><br>
            </div>

        </div>
        <div class="col-md-6 p-3  " id="marks" >
            
          <h5>Math</h5> <input type="number" name="" id="math" class="rounded rounded-5 col-12">
      <h5>Urdu</h5>  <input type="number" name="" id="urdu"class="rounded rounded-5 col-12">
         <h5>English</h5>  <input type="number" name="" id="eng"class="rounded rounded-5 col-12">
  <h5>Sindhi</h5> <input type="number" name="" id="sindhi"class="rounded rounded-5 col-12">
         <h5>Computer</h5>  <input type="number" name="" id="comp" class="rounded rounded-5 mb-5 col-12">




            <button id="btn" >View Results</button>
        </div>
    </div>
</div>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
