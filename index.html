<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    
    #math, #urdu, #eng, #sindhi, #comp{
        display: block;
        border: 2px solid #2564ebab;
        
    }

     #math:hover, #urdu:hover, #eng:hover, #sindhi:hover, #comp:hover{
        box-shadow: 0 0 5px #2564ebab;
        border: 2px solid #2564ebab;
    }
#btn{
    display: block;
    padding: 10px 20px 10px 20px;
    border-radius: 30px;
border-color: #2564eb;

}
#marks{
    background-color: #F8FAFC;
    font-weight: 700;
    border: 1px solid  #2564eb;
}
#output{
    background-color: #2564ebde;
    font-weight: 700;
}
.box{
    margin-top: 80px;
    font-size: 20px;
    font-weight: 700;
}
#status{
    font-size: 30px;
    font-weight: bold;
}
.container{
    margin-top: 50px;

}
</style>
<body>

<nav class="navbar bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand text-light fw-bold">ResultPro</a>
    <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" class="nav-link disabled" aria-disabled="true">
      <button class="btn btn-outline-success" type="submit" class="nav-link disabled" aria-disabled="true">Search</button>
    </form>
  </div>
</nav>          



<div class="container p-5 rounded-5 ">
    <div class="row">
        <div class="col-md-4 p-3  text-center text-white" id="output">
            <h1 class="text-center text-white"> Result</h1>
            <div class="box">
Percentage: <span id="per"></span><br>
            
            Grade: <span id="grade"></span><br>
            Total Marks: <span id="tot"></span><br>
            <span id="status"></span><br>
            </div>

        </div>
        <div class="col-md-6 p-3  " id="marks" >
            
          <h5>Math</h5> <input type="number" name="" id="math" class="rounded rounded-5">
      <h5>Urdu</h5>  <input type="number" name="" id="urdu"class="rounded rounded-5">
         <h5>English</h5>  <input type="number" name="" id="eng"class="rounded rounded-5">
  <h5>Sindhi</h5> <input type="number" name="" id="sindhi"class="rounded rounded-5">
         <h5>Computer</h5>  <input type="number" name="" id="comp" class="rounded rounded-5 mb-5">




            <button id="btn" >View Results</button>
        </div>
    </div>
</div>




    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</body>
<script src="./data.js"></script>
</html>
